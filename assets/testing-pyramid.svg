<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">The testing pyramid</title>
  <desc id="desc">Three tiers. Top: E2E tests (real services, real Stripe) are few, slow and expensive. Middle: integration tests (API mock plus deployed stack) are some in number and medium in speed. Bottom: unit tests (pure logic, in-memory) are many, fast and cheap. Moving up the pyramid, tests get slower and costlier but give higher confidence.</desc>
  <defs>
    <style>
      text { font-family: 'Work Sans', 'Helvetica Neue', Arial, sans-serif; }
      .tier-label { font-size: 24px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .tier-desc  { font-size: 16px; font-weight: 400; fill: #ffffff; text-anchor: middle; }
      .tier-count { font-size: 14px; font-weight: 500; fill: #ffffff; text-anchor: middle; letter-spacing: 0.02em; }
      .side-label { font-size: 16px; font-weight: 600; fill: #a8005a; }
      .axis       { stroke: #6b6b6b; stroke-width: 2; }
      .axis-head  { fill: #6b6b6b; }
      .caption    { font-size: 17px; font-style: italic; fill: #3d3d3d; text-anchor: middle; }
    </style>
  </defs>

  <!-- Solid background so the dark text stays readable on dark pages -->
  <rect width="900" height="536" rx="16" fill="#ffffff"/>

  <!-- Pyramid: three tiers sharing one side slope, narrowest at top -->
  <g id="tier-e2e">
    <polygon points="350.0,40 550.0,40 594.8,132 305.2,132" fill="#a8005a"/>
    <text x="450" y="72" class="tier-label">E2E tests</text>
    <text x="450" y="96" class="tier-desc">Real services, real Stripe</text>
    <text x="450" y="117" class="tier-count">few · slow · expensive</text>
  </g>

  <g id="tier-int">
    <polygon points="300.4,142 599.6,142 658.0,262 242.0,262" fill="#4b4f58"/>
    <text x="450" y="188" class="tier-label">Integration tests</text>
    <text x="450" y="212" class="tier-desc">API mock + deployed stack</text>
    <text x="450" y="233" class="tier-count">some · medium</text>
  </g>

  <g id="tier-unit">
    <polygon points="237.1,272 662.9,272 730.0,410 170.0,410" fill="#00509e"/>
    <text x="450" y="327" class="tier-label">Unit tests</text>
    <text x="450" y="351" class="tier-desc">Pure logic, in-memory</text>
    <text x="450" y="372" class="tier-count">many · fast · cheap</text>
  </g>

  <!-- Left axis: cost and speed increase upward -->
  <line x1="130" y1="410" x2="130" y2="54" class="axis"/>
  <polygon points="130,40 123.5,55 136.5,55" class="axis-head"/>
  <text x="116" y="92" class="side-label" text-anchor="end">slow</text>
  <text x="116" y="112" class="side-label" text-anchor="end">costly</text>
  <text x="116" y="378" class="side-label" text-anchor="end">fast</text>
  <text x="116" y="398" class="side-label" text-anchor="end">cheap</text>

  <!-- Right axis: confidence increases upward -->
  <line x1="770" y1="410" x2="770" y2="54" class="axis"/>
  <polygon points="770,40 763.5,55 776.5,55" class="axis-head"/>
  <text x="784" y="92" class="side-label">high</text>
  <text x="784" y="112" class="side-label">confidence</text>
  <text x="784" y="378" class="side-label">low</text>
  <text x="784" y="398" class="side-label">confidence</text>

  <!-- Caption -->
  <text x="450" y="474" class="caption">The testing pyramid: fewer expensive tests at the top,</text>
  <text x="450" y="498" class="caption">many fast ones at the base.</text>
</svg>